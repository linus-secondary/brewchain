apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app: orders, part-of: brewchain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders, part-of: brewchain }
    spec:
      containers:
        - name: orders
          image: brewchain              # real name/tag set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: orders
          envFrom:
            - configMapRef: { name: brewchain-config }
            - secretRef: { name: db-credentials }   # DATABASE_URL
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # HPA scales on % of this CPU
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:                          # only send traffic when ready
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:                           # restart if it hangs
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels: { app: orders, part-of: brewchain }
spec:
  selector: { app: orders }
  ports:
    - port: 8000
      targetPort: 8000
