apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway, part-of: brewchain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, part-of: brewchain }
    spec:
      containers:
        - name: gateway
          image: brewchain              # real name/tag set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: gateway
          envFrom:
            - configMapRef: { name: brewchain-config }
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # HPA scales on % of this CPU
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:                          # only send traffic when ready
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:                           # restart if it hangs
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway, part-of: brewchain }
spec:
  type: LoadBalancer        # public entry point (AWS creates a Network Load Balancer)
  selector: { app: gateway }
  ports:
    - name: http
      port: 80
      targetPort: 8000
